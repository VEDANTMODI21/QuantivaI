<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuantivaIQ — Retail Analytics & ML Platform</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- ApexCharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
      :root {
        --bg-color: #06090F;
        --card-bg: rgba(15, 23, 42, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        --accent-indigo: #6366F1;
        --accent-purple: #A855F7;
        --accent-cyan: #06B6D4;
        --accent-emerald: #10B981;
        --accent-rose: #F43F5E;
        --accent-amber: #F59E0B;
        --accent-gradient: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
      }

      * {
        box-sizing: border-box;
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        background-image: 
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
        background-attachment: fixed;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 32px 60px;
      }

      /* Navbar & Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 20px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .header-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        background: var(--accent-gradient);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      }

      .logo-icon svg {
        width: 26px;
        height: 26px;
        fill: #FFFFFF;
      }

      .header-title-group h1 {
        font-family: 'Outfit', sans-serif;
        margin: 0;
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FFFFFF 20%, #CBD5E1 50%, #A855F7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-title-group p {
        margin: 4px 0 0;
        font-size: 0.92rem;
        color: var(--text-secondary);
        font-weight: 400;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .currency-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: var(--accent-emerald);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.3);
        color: #818CF8;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        font-family: 'Outfit', sans-serif;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background-color: var(--accent-emerald);
        border-radius: 50%;
        box-shadow: 0 0 12px var(--accent-emerald);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px var(--accent-emerald); }
        100% { transform: scale(0.9); opacity: 0.6; }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 12px;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 0.88rem;
        cursor: pointer;
        border: none;
        text-decoration: none;
      }

      .btn-primary {
        background: var(--accent-gradient);
        color: #FFFFFF;
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      }

      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      /* Navigation Tabs */
      .nav-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 28px;
        background: rgba(15, 23, 42, 0.65);
        padding: 8px;
        border-radius: 16px;
        border: 1px solid var(--card-border);
        backdrop-filter: blur(16px);
      }

      .nav-tab {
        flex: 1 1 auto;
        padding: 10px 18px;
        border-radius: 10px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        background: transparent;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        text-align: center;
      }

      .nav-tab:hover {
        color: #FFFFFF;
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .nav-tab.active {
        background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
        color: #FFFFFF;
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Custom Sleek Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.4);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.7);
      }

      /* Modern Glass Toast Notification */
      #toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }

      .toast {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #FFFFFF;
        padding: 14px 22px;
        border-radius: 14px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      /* Metric KPI Grid */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }

      .kpi-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 22px 24px;
        backdrop-filter: blur(16px);
        position: relative;
        overflow: hidden;
      }

      .kpi-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--accent-gradient);
        opacity: 0.8;
      }

      .kpi-card:hover {
        transform: translateY(-4px);
        border-color: rgba(99, 102, 241, 0.35);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      }

      .kpi-title {
        font-family: 'Outfit', sans-serif;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .kpi-value {
        font-family: 'Outfit', sans-serif;
        font-size: 2.1rem;
        font-weight: 800;
        color: #FFFFFF;
        letter-spacing: -0.02em;
        margin: 4px 0;
      }

      .kpi-subtext {
        font-size: 0.82rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .kpi-subtext.positive { color: var(--accent-emerald); }
      .kpi-subtext.warning { color: var(--accent-rose); }

      /* Chart Cards & Section Grids */
      .section-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
        gap: 24px;
        margin-bottom: 32px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 24px;
        backdrop-filter: blur(16px);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .card-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.88rem;
      }

      th {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.025);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
      th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
        color: #FFFFFF;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.76rem;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
      }

      .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
      .badge-danger { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.3); }
      .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
      .badge-purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }

      /* Tab Panels */
      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .container { padding: 16px; }
        .section-grid { grid-template-columns: 1fr; }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navbar / Header -->
      <div class="header">
        <div class="header-info">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
          </div>
          <div class="header-title-group">
            <h1>QuantivaIQ Platform</h1>
            <p>Retail Analytics &amp; ML Platform • Demand Forecasting • Fraud Engine • RFM Segments</p>
          </div>
        </div>

        <div class="header-actions">
          <div class="currency-badge">
            <span>£ GBP Currency</span>
          </div>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>LIVE ANALYTICS ACTIVE</span>
          </div>
          <button class="btn btn-secondary" onclick="triggerSimulation()">
            ⚡ Simulate Order
          </button>
          <a class="btn btn-primary" href="/api/export/csv" target="_blank">
            📥 Export Report (CSV)
          </a>
        </div>
      </div>

      {% block content %}{% endblock %}
    </div>

    <div id="toast-container"></div>

    <script>
      function showToast(msg, isError = false) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.style.borderColor = 'rgba(244, 63, 94, 0.6)';
        toast.innerHTML = (isError ? '❌ ' : '⚡ ') + msg;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-10px)';
          setTimeout(() => toast.remove(), 400);
        }, 3200);
      }
    </script>
  </body>
</html>
